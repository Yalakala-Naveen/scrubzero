[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubzero"
version = "0.1.0"
description = "Zero-dependency PII and secret redaction for logs, prompts and datasets — checksum-validated (Luhn, IBAN mod-97), deterministic, with a report that never re-exposes a raw value."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Naveen Yalakala" }]
keywords = ["pii", "redaction", "privacy", "secrets", "scrubbing", "gdpr", "logs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
scrubzero = "scrubzero.cli:main"

[project.urls]
Homepage = "https://github.com/Yalakala-Naveen/scrubzero"
Issues = "https://github.com/Yalakala-Naveen/scrubzero/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
